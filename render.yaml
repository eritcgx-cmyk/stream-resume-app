services:
  - type: web
    name: stream-resume-video-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATA_DIR
        value: /data
    disk:
      name: video-storage
      mountPath: /data
      sizeGB: 10
